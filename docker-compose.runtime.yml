services:
  app:
    image: ghcr.io/lovemoon51/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3001:8000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: json
