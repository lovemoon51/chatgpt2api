services:
  app:
    image: ghcr.io/lovemoon51/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3001:8000"
    volumes:
      # 容器以 UID 1000 运行；启动前确保宿主机执行：
      #   mkdir -p data && sudo chown -R 1000:1000 config.json data
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: json
      # POSTGRES_SYNC_DATABASE_URL: postgresql://user:password@host:5432/dbname
      # IMAGE_METADATA_DATABASE_URL: postgresql://user:password@host:5432/dbname
