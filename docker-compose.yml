services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3001:8000"
    volumes:
      # 容器以 UID 1000 运行；启动前确保宿主机执行：
      #   mkdir -p data && sudo chown -R 1000:1000 config.json data
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      STORAGE_BACKEND: json
      POSTGRES_SYNC_DATABASE_URL: ${POSTGRES_SYNC_DATABASE_URL:-}
      IMAGE_METADATA_DATABASE_URL: ${IMAGE_METADATA_DATABASE_URL:-}
      
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # DATABASE_URL: postgresql://user:password@host:5432/dbname
      # DATABASE_URL: sqlite:///app/data/accounts.db
      # PostgreSQL 同步配置 (保留当前 STORAGE_BACKEND，并优先从 PostgreSQL 读取)
      # POSTGRES_SYNC_DATABASE_URL: postgresql://user:password@host:5432/dbname
      # 图片元数据数据库配置 (图片文件仍保存在 data/images)
      # IMAGE_METADATA_DATABASE_URL: postgresql://user:password@host:5432/dbname
      
      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # GIT_REPO_URL: https://github.com/user/repo.git
      # GIT_TOKEN: ghp_xxxxxxxxxxxx
      # GIT_BRANCH: main
      # GIT_FILE_PATH: accounts.json
      
      # 认证密钥 (可选，覆盖 config.json)
      # CHATGPT2API_AUTH_KEY: your_secret_key
      
      # 基础 URL (可选)
      # CHATGPT2API_BASE_URL: https://your-domain.com
    networks:
      - default
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: sub2api-deploy_sub2api-network
